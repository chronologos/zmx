[package]
name = "zmx-bridge"
version = "0.1.0"
edition = "2024"
description = "Streams what zmx sessions on this host report about themselves, as JSON lines"
publish = false

[dependencies]
rustix = { version = "1", features = ["event", "fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
